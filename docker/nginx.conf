# olomol: static files only (everything runs in the browser), behind a password.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    auth_basic "olomol";
    auth_basic_user_file /etc/nginx/olomol.htpasswd;

    # the files are big (RDKit and Indigo as WebAssembly): sent compressed
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json application/wasm image/svg+xml text/plain;

    add_header X-Content-Type-Options nosniff always;

    # file names with a hash in them never change: kept a year
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    # the pages themselves, the service worker and the app manifest: asked
    # again each time, so a new version shows at once
    location ~ (\.html|/sw\.js)$ {
        expires -1;
    }
    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        expires -1;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    # for the server's monitoring, without the password
    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
