<!doctype html>
<!-- What a "PubChem page" button opens: src/pubchemPage.js finds the compound
     on PubChem and goes on to its page. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>PubChem</title>
    <style>
      :root { --bg: #f7f8fb; --text: #1c1f26; --muted: #687082; --accent: #1035a9; --panel: #ffffff; --edge: rgba(20, 25, 45, 0.1); color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #13151b; --text: #e7e9f0; --muted: #a0a6b6; --accent: #7b96f2; --panel: #1b1e26; --edge: rgba(255, 255, 255, 0.09); } }
      :root[data-theme='dark'] { --bg: #13151b; --text: #e7e9f0; --muted: #a0a6b6; --accent: #7b96f2; --panel: #1b1e26; --edge: rgba(255, 255, 255, 0.09); }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #message { max-width: 620px; padding: 0 16px; text-align: center; color: var(--muted); }
      #message.choice { max-width: 980px; padding: 32px 16px; }
      #message.choice > .notice { margin: 0 auto 22px; max-width: 640px; padding: 14px 18px; border-radius: 12px; border: 1px solid var(--edge);
        border-left: 4px solid var(--accent); background: var(--panel); text-align: left; display: flex; flex-direction: column; gap: 4px; }
      .notice strong { font-size: 18px; color: var(--text); }
      .notice span { color: var(--muted); }
      /* the compounds to choose from: a card each, PubChem's picture of it, its name and number */
      .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; text-align: left; }
      .card { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid var(--edge); border-radius: 12px; background: var(--panel);
        color: var(--text); text-decoration: none; box-shadow: 0 2px 8px rgba(25, 30, 60, 0.06); transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s; }
      .card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 8px 24px rgba(25, 30, 60, 0.12); }
      .card img { width: 100%; height: 150px; object-fit: contain; background: white; border-radius: 8px; }
      .card .name { font-size: 13.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
      .card .cid { font-size: 12px; color: var(--muted); }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="message"></div>
    <script type="module" src="/src/pubchemPage.js"></script>
  </body>
</html>
