    <style>
      .lock { --bg: #f7f8fb; --card: #ffffff; --text: #1c1f26; --muted: #687082; --edge: rgba(20, 24, 40, 0.12); --accent: #1035a9; --danger: #d1243f;

      :root[data-theme='dark'] .lock { --bg: #13151b; --card: #1c1f27; --text: #e7e9f0; --muted: #a0a6b6; --edge: rgba(255, 255, 255, 0.12); --accent: #7b96f2; --danger: #ff6b81; }

      .lock input[type='password']:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
      .lock label { display: flex; align-items: center; gap: 8px; margin: 12px 0 16px; color: var(--muted); font-size: 13.5px; }
      .lock button { width: 100%; height: 38px; border: 0; border-radius: 7px; background: linear-gradient(135deg, #1035a9, #2e6fdb); color: white; font: inherit; font-weight: 600; cursor: pointer; }
